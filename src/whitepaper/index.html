<style>
  :root{--bg:#040406;--ink:#f0ede6;--soft:#b3afa6;--mute:#76726a;--gold:#c5a572;--goldb:#f0dca8;--line:rgba(197,165,114,.22);--lsoft:rgba(255,255,255,.06);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:clip}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px}
  .top{border-bottom:1px solid var(--lsoft);padding:22px 0;position:sticky;top:0;background:rgba(4,4,6,.72);backdrop-filter:blur(14px);z-index:5}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{font-family:var(--serif);font-size:22px;letter-spacing:.14em}
  .brand .e{font-size:9px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase;margin-left:8px}
  .back{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);padding:9px 16px;transition:all .25s}
  .back:hover{background:var(--gold);color:#0a0a0a}
  .head{padding:64px 0 34px;text-align:center}
  .kick{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-weight:500}
  .head h1{font-family:var(--serif);font-weight:300;font-size:clamp(38px,7vw,74px);line-height:1;margin:18px 0 12px}
  .head h1 .it{font-style:italic;color:var(--goldb)}
  .head p{color:var(--soft);max-width:52ch;margin:0 auto;font-size:15px}
  .paper{max-width:900px;margin:20px auto 70px;background:#fff;border:1px solid var(--line);box-shadow:0 30px 120px rgba(0,0,0,.6)}
  .paper iframe{display:block;width:100%;height:82vh;min-height:640px;border:0;background:#fff}
  .paperbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 18px;background:#0b0c10;border-bottom:1px solid var(--lsoft);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
  .paperbar a{color:var(--goldb)}
  footer{border-top:1px solid var(--lsoft);padding:40px 0 70px;color:var(--mute);font-size:12px;text-align:center;letter-spacing:.04em}
  footer a{color:var(--gold)}
</style>
</head>
